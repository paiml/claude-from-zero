# "If verdict is 'approve', findings.severity must not contain 'error'."
#
# This is the exact failure mode /review-demo must catch — a sub-agent
# that flags a critical bug and then approves the diff anyway. The
# validate-finding binary rejects this fixture with exit code 2.

reviewer: explore-agent-pass-2
target: m4-review/src/bin/diff_target.rs
findings:
