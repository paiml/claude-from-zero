# contracts/review-finding.yaml
#
# Sub-agent output schema for the Module 4 parallel code-review demo.
# A sub-agent reviewing the m4-review target must return a structured
# document conforming to this schema. The parent agent validates the
# sub-agent's YAML response against this schema before accepting the
# review; if validation fails, the parent re-prompts with the schema
# violations.
#
# Inspired by aprender-contracts (YAML invariants → compile-time
# guardrails). For Claude from Zero, we use the same authoring style
# but validate at runtime via serde_yaml deserialization.

name: review-finding-v1
description: Structured review output from a sub-agent code reviewer

schema:
  reviewer:
    type: string
    description: Identifier for the sub-agent that produced this review
    required: true

  target:
    type: string
    description: File path of the code under review
    required: true

  findings:
    type: array
    description: Concrete issues the reviewer identified
    required: true
    min_items: 0
    max_items: 10
    items:
      severity:
        type: string
        enum: [info, warning, error]
        required: true
      line:
        type: integer
        minimum: 1
        required: true
      message:
        type: string
        min_length: 10
        max_length: 280
        required: true
      category:
        type: string
        enum: [correctness, style, performance, safety, readability]
        required: true

  verdict:
    type: string
    enum: [approve, request-changes, comment]
    description: Overall reviewer verdict
    required: true

  rationale:
    type: string
    description: One-paragraph justification for the verdict
    min_length: 20
    max_length: 500
    required: true

# Invariants the parent agent enforces after deserialization:
#
#   1. If verdict is "approve", findings.severity must not contain "error".
#   2. If findings.severity contains "error", verdict must be "request-changes".
#   3. Every findings[i].line must be a valid line number in `target`.
#   4. rationale must mention the target filename at least once.
#
# A sub-agent response that violates any invariant is rejected and
# the parent re-prompts, quoting the specific violation.
